name: Deploy BunPlan CRM Website
on:
  push:
    branches:
      - 'fix/5.3-crm-public-render'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "bunplan-crm-pages"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static CRM site
        run: |
          mkdir -p _site
          cp admin/index.html _site/index.html
          cp admin/admin.css admin/crm.css admin/admin.js admin/crm.js _site/
          touch _site/.nojekyll
          test -s _site/index.html
          echo 'BunPlan CRM static website ready'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
