name: Build BunPlan Native AdMob Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-bunplan-admob-test.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with Google test ads SDK
        run: gradle --no-daemon -p android-native :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BunPlan-3.6-AdMob-TEST-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
