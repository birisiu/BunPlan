name: Build BunPlan Native AdMob Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-bunplan-admob-test.yml'
permissions:
  contents: write
concurrency:
  group: bunplan-apk-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate onboarding/app scripts and brand assets
        run: node scripts/check-bunplan-js.mjs
      - name: Build APK with Google Mobile Ads and UMP
        env:
          BUNPLAN_GOOGLE_WEB_CLIENT_ID: ${{ vars.BUNPLAN_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon -p android-native :app:assembleDebug
      - name: Verify Android signing certificate and write Google SHA-1 metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android-native/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -s "$APK"
          "$SIGNER" verify --print-certs "$APK" > /tmp/bunplan-apk-certificates.txt
          cat /tmp/bunplan-apk-certificates.txt
          grep -i 'certificate SHA-1 digest' /tmp/bunplan-apk-certificates.txt | head -1 > /tmp/bunplan-sha1.txt
          cat /tmp/bunplan-sha1.txt
      - name: Save verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunPlan-4.2-Google-Login-TEST
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 20
      - name: Publish APK to public builds folder
        shell: bash
        run: |
          set -euo pipefail
          cp android-native/app/build/outputs/apk/debug/*.apk /tmp/bunplan-release.apk
          git config user.name bunplan-bot
          git config user.email bunplan-bot@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p builds
            cp /tmp/bunplan-release.apk builds/BunPlan-4.2-Google-Login-TEST.apk
            cp /tmp/bunplan-sha1.txt builds/BunPlan-4.2-Google-Login-SHA1.txt
            printf 'SUCCESS - APK compiled + published at %s UTC\n' "$(date -u +%FT%TZ)" > builds/build-status.txt
            git add builds/BunPlan-4.2-Google-Login-TEST.apk builds/BunPlan-4.2-Google-Login-SHA1.txt builds/build-status.txt
            git commit -m "build: publish BunPlan 4.2 Google Login OAuth test and signature" || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "GitHub publish conflict persisted, but APK is available in Actions Artifacts."
          exit 1
