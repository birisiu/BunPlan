name: Build BunPlan Native AdMob Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-bunplan-admob-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with Google test ads SDK
        run: |
          set -o pipefail
          gradle --no-daemon -p android-native :app:assembleDebug 2>&1 | tee bunplan-build.log
      - name: Save APK in public repository for direct installation
        if: success()
        run: |
          mkdir -p builds
          cp android-native/app/build/outputs/apk/debug/*.apk builds/BunPlan-3.7-AdMob-TEST-FIX.apk
          printf 'SUCCESS - native test APK built on %s\n' "$(date -u)" > builds/build-status.txt
          git config user.name bunplan-bot
          git config user.email bunplan-bot@users.noreply.github.com
          git add builds/
          git commit -m "build: test AdMob APK" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Record build error for diagnostics
        if: failure()
        run: |
          mkdir -p builds
          printf 'FAILURE - native build at %s, run %s.\n' "$(date -u)" "$GITHUB_RUN_ID" > builds/build-status.txt
          tail -n 150 bunplan-build.log >> builds/build-status.txt || true
          git config user.name bunplan-bot
          git config user.email bunplan-bot@users.noreply.github.com
          git add builds/build-status.txt
          git commit -m "build: mark AdMob build failure" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: BunPlan-3.7-AdMob-TEST-FIX-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
