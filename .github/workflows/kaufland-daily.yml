name: Kaufland weekly food offers
on:
  workflow_dispatch:
  schedule:
    - cron: '45 9 * * *'
  push:
    paths:
      - 'scripts/kaufland_daily.py'
      - '.github/workflows/kaufland-daily.yml'
permissions:
  contents: write
concurrency:
  group: kaufland-daily
  cancel-in-progress: false
jobs:
  offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Import published weekly offers
        run: python scripts/kaufland_daily.py
      - name: Save catalogue
        run: |
          git config user.name bunplan-bot
          git config user.email bunplan-bot@users.noreply.github.com
          git add data/kaufland_offers.* docs/api/kaufland/kaufland_offers.*
          if ! git diff --cached --quiet; then
            git commit -m "data: update current Kaufland offers"
            git push
          fi
      - name: Publish downloadable catalog
        uses: actions/upload-artifact@v4
        with:
          name: kaufland-offers
          path: |
            data/kaufland_offers.json
            data/kaufland_offers.csv
          if-no-files-found: error
          retention-days: 14
