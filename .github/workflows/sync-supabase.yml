name: Sync verified prices to Supabase
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Check Supabase configuration (secrets only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'SUPABASE_URL is not configured' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'SUPABASE_SERVICE_ROLE_KEY is not configured' && exit 1)
      - name: Sync Lidl and Kaufland independently
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_catalog_to_supabase.py
