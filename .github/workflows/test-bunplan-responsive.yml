name: Test BunPlan Responsive Screens
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test-responsive.mjs'
      - '.github/workflows/test-bunplan-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Exercise onboarding and profile at different phone widths
        run: node scripts/test-responsive.mjs
      - name: Keep UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunplan-mobile-ui-screenshots
          path: builds/ui-preview/*.png
          if-no-files-found: ignore
