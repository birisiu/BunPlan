name: Test BunPlan Responsive Screens
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'scripts/test-responsive.mjs'
      - '.github/workflows/test-bunplan-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Exercise onboarding, profile and shopping list on different phones
        run: node scripts/test-responsive.mjs
      - name: Test secure BunPlan content admin
        run: node scripts/test-admin.mjs
      - name: Test only ADMIN credential and private password recovery
        run: node scripts/test-admin-exclusive-login.mjs
      - name: Test guided first-use tour and fresh CRM synchronization
        run: node scripts/test-tour-refresh.mjs
      - name: Test complete BunPlan CRM operations
        run: node scripts/test-crm.mjs
      - name: Test backend content CMS editing
        run: node scripts/test-content-cms.mjs
      - name: Smoke-test the REAL published Supabase CRM website
        run: node scripts/test-crm-public.mjs
      - name: Keep UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunplan-mobile-ui-screenshots
          path: builds/ui-preview/*.png
          if-no-files-found: ignore
