name: BunPlan Android APK test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect APK
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging android-native/app/build/outputs/apk/debug/app-debug.apk | head -6
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk | tee BunPlan-Android-Test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BunPlan-Android-Test-APK
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            BunPlan-Android-Test.sha256
          if-no-files-found: error
