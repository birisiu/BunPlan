name: Lidl daily food prices
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: write
concurrency:
  group: lidl-daily
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyxlsb
      - name: Refresh Lidl catalog
        run: python scripts/lidl_daily.py
      - name: Save catalog
        run: |
          git config user.name "bunplan-bot"
          git config user.email "bunplan-bot@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: Lidl price snapshot"
            git push
          fi
