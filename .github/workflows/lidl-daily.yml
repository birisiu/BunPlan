name: Lidl daily food prices
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/lidl_daily.py'
      - '.github/workflows/lidl-daily.yml'
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: write
concurrency:
  group: lidl-daily
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyxlsb
      - name: Refresh Lidl catalog
        run: python scripts/lidl_daily.py
      - name: Save catalog
        run: |
          git config user.name "bunplan-bot"
          git config user.email "bunplan-bot@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: Lidl price snapshot"
            git push
          fi
      - name: Upload price catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: lidl-food-prices
          path: |
            data/lidl_products.json
            data/lidl_products.csv
          if-no-files-found: error
          retention-days: 14
