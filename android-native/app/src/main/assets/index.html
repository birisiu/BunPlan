<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7ef">
<title>BunPlan — Prototype interactiv</title>
<style>
:root{--bg:#f6f7ef;--green:#174d3f;--deep:#12392f;--lime:#ddf479;--ink:#182922;--muted:#78877c;--line:#dde5d9;--white:#fff;--peach:#ffcba9}
*{box-sizing:border-box}html{background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{margin:0;min-height:100vh;background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #81b4a7;outline-offset:2px}
.app{width:min(100%,430px);min-height:100svh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 5px 70px #1b423011}.in{padding:26px 25px 30px;flex:1;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;letter-spacing:-1.2px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:var(--lime);font-size:27px;font-weight:800;line-height:1}
.hero{margin-top:44px;height:260px;background:var(--green);border-radius:33px;overflow:hidden;position:relative;padding:26px 24px;color:white;isolation:isolate}.hero:before{content:"";position:absolute;width:218px;height:218px;background:var(--lime);border-radius:50%;right:-63px;top:-74px;z-index:-1}.hero:after{content:"";position:absolute;width:165px;height:165px;background:#377864;border-radius:50%;bottom:-105px;left:-55px;z-index:-1}.kicker{font-size:10px;letter-spacing:1.3px;font-weight:800;color:var(--lime)}.hero h2{font-size:37px;line-height:1.03;letter-spacing:-1.5px;margin:24px 0;font-weight:880}.floating{position:absolute;bottom:16px;right:14px;background:#fff;border-radius:17px;padding:10px 14px;display:flex;align-items:center;gap:9px;color:var(--ink);box-shadow:0 10px 30px #0002;transform:rotate(-4deg)}.float-icon{font-size:31px}.floating strong{display:block;font-size:12px}.floating small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.headline{font-size:34px;letter-spacing:-1.2px;line-height:1.12;font-weight:900;margin:28px 0 12px}.sub{font-size:15px;color:var(--muted);line-height:1.6;margin:0}.push{flex:1;min-height:18px}.primary{width:100%;height:59px;border:0;border-radius:19px;background:var(--green);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:13px}.primary .arrow{font-size:25px;font-weight:400;line-height:1}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:0;background:transparent;color:var(--green);font-weight:750;font-size:14px;padding:17px}.foot{font-size:11px;text-align:center;color:#879489}.wizard-head{padding:14px 25px 0}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{border:0;padding:9px 0;background:none;color:var(--green);font-size:14px;font-weight:800}.stepcap{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1.4px}.track{width:100%;height:7px;background:#dfe7da;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:99px;transition:width .25s}.wtitle{font-size:30px;line-height:1.13;letter-spacing:-1.1px;font-weight:900;margin:26px 0 10px}.wdesc{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 23px}.stage{padding:0 25px 10px;flex:1}.whitebox{background:#fff;border-radius:23px;padding:21px;margin-bottom:16px}.label{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:1.05px;text-transform:uppercase}.money{font-size:55px;font-weight:900;color:var(--green);line-height:1.2;letter-spacing:-2px;margin:8px 0 21px}.money small{font-size:18px;letter-spacing:0}input[type=range]{width:100%;accent-color:var(--green);cursor:pointer}.rangeends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:12px}.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 0 19px}.pill{border:0;border-radius:15px;background:#fff;padding:16px 5px;color:var(--ink);font-size:13px;font-weight:800}.pill.sel{background:var(--green);color:#fff}.notice{background:#e5f0d8;border-radius:16px;padding:14px;display:flex;gap:11px;color:var(--deep);font-size:12px;line-height:1.5}.notice b{font-size:19px}.wizard-bottom{padding:12px 25px 28px}.option{border:1.5px solid transparent;border-radius:18px;background:#fff;width:100%;min-height:71px;margin:0 0 12px;text-align:left;display:flex;align-items:center;gap:13px;padding:12px 17px;color:var(--ink)}.option.sel{background:#e9f5d9;border-color:var(--green)}.option .em{font-size:28px}.option strong{font-size:15px;flex:1}.check{height:23px;width:23px;border-radius:50%;display:grid;place-items:center;background:#f2f5ee;color:transparent;font-weight:900}.sel .check{background:var(--green);color:white}.counter{background:white;border-radius:19px;padding:19px 14px;display:flex;align-items:center;margin:0 0 13px;gap:11px}.counter .em{font-size:31px}.counter .ctitle{font-weight:800;display:block}.counter small{display:block;color:var(--muted);margin-top:3px;font-size:11px}.counter .grow{flex:1}.round{border:0;border-radius:50%;height:35px;width:35px;background:#eaf2e6;color:var(--green);font-size:20px;font-weight:700}.count{font-weight:900;font-size:18px;min-width:14px;text-align:center}.flexchips{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.chip{background:#fff;border:1.5px solid #e8eee4;border-radius:14px;padding:12px 15px;font-size:13px;font-weight:700}.chip.sel{background:#e8f5d8;border-color:var(--green)}.field{width:100%;height:55px;border:1.5px solid #e1e9df;border-radius:16px;padding:0 16px;font-size:15px;background:#fff;outline:none;color:var(--ink)}.field:focus{border-color:var(--green)}.fieldlab{display:block;margin-bottom:8px;margin-top:13px;color:#53655a;font-size:13px;font-weight:750}.auth .brand{margin-top:15px}.auth h1{font-size:36px;line-height:1.08;letter-spacing:-1.3px;margin:42px 0 11px}.auth .sub{font-size:14px;margin-bottom:24px}.auth .field{margin-bottom:10px}.auth label.fieldlab{margin-top:3px}.terms{display:flex;align-items:flex-start;gap:10px;margin:6px 0 16px;color:var(--muted);font-size:12px;line-height:1.5}.terms input{accent-color:var(--green);margin-top:3px}.error{color:#b4423b;font-size:12px;margin-bottom:12px;line-height:1.5}.home-head{display:flex;align-items:center;justify-content:space-between}.home h1{font-size:31px;margin:40px 0 4px;letter-spacing:-1px}.bigcard{border-radius:27px;background:linear-gradient(125deg,var(--green),var(--deep));color:white;padding:24px;margin:25px 0}.bigcard .label{color:var(--lime)}.bigcard .bigmoney{font-size:39px;font-weight:900;margin:9px 0 9px}.bigcard small{color:#d2e3d7}.edit{margin-top:25px;display:inline-block;background:var(--lime);color:var(--green);padding:12px 17px;font-size:13px;font-weight:850;border-radius:13px;border:0}.recipe{display:flex;align-items:center;gap:14px;padding:13px;margin:11px 0;background:white;border-radius:18px}.recipe .ico{font-size:27px;background:#f4f7ef;width:63px;height:63px;display:grid;place-items:center;border-radius:15px}.recipe strong{font-size:15px}.recipe small{color:var(--muted);font-size:12px;display:block;margin-top:5px}.demo-banner{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.8px;font-weight:850;margin-bottom:12px}
@media(min-width:470px){body{padding:35px 0}.app{min-height:850px;border-radius:34px;border:8px solid #202c26;max-width:410px;box-shadow:0 18px 70px #1b42302a}.in{min-height:795px}}
</style>
</head>
<body><main class="app" id="app" aria-live="polite"></main>
<script>
let s={page:'welcome',step:0,budget:400,adults:2,children:0,diet:'Echilibrat',exclusions:[],meals:3,time:30,stores:['Lidl','Kaufland','Carrefour','Mega Image'],city:'București',mode:'signup',error:'',name:'',email:'',password:'',confirm:'',accepted:false};
const $=id=>document.getElementById(id),brand=()=>`<div class="brand"><div class="mark">✳</div>bunplan</div>`,next=`<span class="arrow">→</span>`,esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function upd(field,val){s[field]=val;render()};function toggle(field,name){s[field]=s[field].includes(name)?s[field].filter(v=>v!==name):[...s[field],name];render()}
function welcome(){return `<div class="in">${brand()}<div class="hero"><div class="kicker">MAI PUȚINĂ RISIPĂ</div><h2>7 zile.<br>Mese bune.<br>Buget smart.</h2><div class="floating"><span class="float-icon">🥑</span><div><strong>Meniu personalizat</strong><small>Pentru întreaga săptămână</small></div></div></div><div class="headline">Mănânci bine.<br>Cheltuiești cu cap.</div><p class="sub">Spune-ne bugetul și ce îți place să mănânci. Îți pregătim un plan de mese și o listă inteligentă de cumpărături.</p><div class="push"></div><button class="primary" onclick="s.step=0;s.page='wizard';render()">Începe planificarea ${next}</button><button class="secondary" onclick="s.mode='login';s.page='auth';render()">Ai deja cont? Intră în cont</button><div class="foot">Planificare simplă. Fără risipă.</div></div>`}
const titles=['Cât vrei să cheltuiești?','Cine se așază la masă?','Cum îți place să mănânci?','Cum arată o zi ideală?','De unde faci cumpărăturile?'];
const subs=['Alegem rețete care se potrivesc cu bugetul tău săptămânal.','Adaptăm porțiile și cantitățile pentru familia ta.','Ținem cont de stilul tău alimentar și de alimentele evitate.','Planul trebuie să se potrivească și programului tău.','Vom căuta oferte relevante din magazinele tale preferate.'];
function cbutton(txt,selected,fn){return `<button class="pill ${selected?'sel':''}" onclick="${fn}">${txt}</button>`}
function option(icon,txt,selected,fn){return `<button class="option ${selected?'sel':''}" onclick="${fn}"><span class="em">${icon}</span><strong>${txt}</strong><span class="check">✓</span></button>`}
function notice(icon,txt){return `<div class="notice"><b>${icon}</b><div>${txt}</div></div>`}
function counter(key,icon,title,sub,min,max){return `<div class="counter"><span class="em">${icon}</span><div class="grow"><strong class="ctitle">${title}</strong><small>${sub}</small></div><button class="round" onclick="upd('${key}',Math.max(${min},s.${key}-1))">−</button><span class="count">${s[key]}</span><button class="round" onclick="upd('${key}',Math.min(${max},s.${key}+1))">+</button></div>`}
function stage(){if(s.step===0)return `<div class="whitebox"><div class="label">Buget săptămânal</div><div class="money">${s.budget} <small>RON</small></div><input aria-label="Buget" type="range" min="100" max="1500" step="25" value="${s.budget}" oninput="s.budget=+this.value;document.querySelector('.money').innerHTML=s.budget+' <small>RON</small>';document.querySelector('#dayvalue').textContent=Math.round(s.budget/7)"/><div class="rangeends"><span>100 RON</span><span>1.500 RON</span></div></div><strong>Alege rapid</strong><div class="pills">${[250,400,650,900].map(v=>cbutton(v,s.budget===v,`upd('budget',${v})`)).join('')}</div>${notice('✦',`Aproximativ <b id="dayvalue" style="font-size:12px">${Math.round(s.budget/7)}</b> RON pe zi, pentru toate mesele.`)}`;
if(s.step===1)return `${counter('adults','👨‍🍳','Adulți','Porții complete',1,8)}${counter('children','🧒','Copii','Porții ajustabile',0,8)}${notice('♥',`Vom calcula rețete pentru ${s.adults+s.children} persoane.`)}`;
if(s.step===2)return `<div class="label" style="margin-bottom:12px">Stilul tău</div>${[['Echilibrat','🥗'],['Economic','🛒'],['Bogat în proteine','🥚'],['Vegetarian','🥦']].map(([n,i])=>option(i,n,s.diet===n,`upd('diet','${n}')`)).join('')}<div class="label" style="margin-top:18px">Alimente pe care le eviți</div><div class="flexchips" style="margin-bottom:19px">${['Lactoză','Gluten','Nuci','Pește'].map(n=>`<button class="chip ${s.exclusions.includes(n)?'sel':''}" onclick="toggle('exclusions','${n}')">${n}</button>`).join('')}</div>${notice('ⓘ','Excluderile sunt preferințe de filtrare, nu garanții pentru alergii severe.')}`;
if(s.step===3)return `<div class="label">Mese pe zi</div><div class="pills" style="grid-template-columns:1fr 1fr">${[2,3].map(n=>cbutton(`${n} mese`,s.meals===n,`upd('meals',${n})`)).join('')}</div><div class="label" style="margin-bottom:13px">Timp maxim de gătit</div>${[15,30,45,60].map(n=>option('⏱',`${n} minute`,s.time===n,`upd('time',${n})`)).join('')}${notice('✦','Prioritizăm rețete practice, cu ingrediente folosite în mai multe preparate.')}`;
return `<div class="label" style="margin-bottom:12px">Supermarketuri</div>${[['Lidl','🟡'],['Kaufland','🔴'],['Carrefour','🔵'],['Mega Image','🟢']].map(([n,i])=>option(i,n,s.stores.includes(n),`toggle('stores','${n}')`)).join('')}<label class="fieldlab" for="city">Oraș</label><input class="field" id="city" placeholder="Orașul tău" value="${esc(s.city)}" oninput="s.city=this.value"/><div style="height:12px"></div>${notice('ⓘ','În acest MVP, prețurile și stocurile magazinelor nu sunt conectate încă.')}`}
function wizard(){return `<div class="wizard-head"><div class="topline"><button class="back" onclick="back()">← Înapoi</button><span class="stepcap">PASUL ${s.step+1} DIN 5</span></div><div class="track"><div class="bar" style="width:${20*(s.step+1)}%"></div></div><div class="wtitle">${titles[s.step]}</div><p class="wdesc">${subs[s.step]}</p></div><div class="stage">${stage()}</div><div class="wizard-bottom"><button class="primary" onclick="forward()" ${s.step===4&&!s.stores.length?'disabled':''}>${s.step===4?'Continuă spre cont':'Continuă'} ${next}</button><p class="foot">Poți modifica preferințele mai târziu.</p></div>`}
function back(){if(s.page==='wizard'){if(s.step)s.step--;else s.page='welcome'}else if(s.page==='auth'){s.page=s.mode==='signup'?'wizard':'welcome'}render()}
function forward(){if(s.step<4){s.step++;render();return}if(!s.stores.length||!s.city.trim())return;s.mode=localStorage.getItem('bunplan-account')?'login':'signup';s.page='auth';render()}
function auth(){let reg=s.mode==='signup';return `<div class="in auth"><button class="back" onclick="back()">← Înapoi</button>${brand()}<h1>${reg?'Hai să facem<br>un plan bun.':'Bine ai revenit!'}</h1><p class="sub">${reg?'Îți salvăm preferințele pe acest dispozitiv, pentru o planificare mai simplă.':'Intră în contul tău local și continuă planificarea.'}</p><div class="demo-banner">Demonstrativ · cont pe acest dispozitiv</div><form onsubmit="authSubmit(event)">${reg?`<label class="fieldlab" for="nm">Numele tău</label><input class="field" id="nm" value="${esc(s.name)}" oninput="s.name=this.value" autocomplete="name"/>`:''}<label class="fieldlab" for="em">Email</label><input class="field" id="em" value="${esc(s.email)}" oninput="s.email=this.value" autocomplete="email" type="email"/><label class="fieldlab" for="pw">Parolă</label><input class="field" id="pw" oninput="s.password=this.value" type="password" autocomplete="${reg?'new-password':'current-password'}"/>${reg?`<label class="fieldlab" for="pwc">Confirmă parola</label><input class="field" id="pwc" type="password" oninput="s.confirm=this.value" autocomplete="new-password"/><label class="terms"><input type="checkbox" ${s.accepted?'checked':''} onchange="s.accepted=this.checked"/>Înțeleg că acesta este un cont local demonstrativ, fără sincronizare în cloud.</label>`:''}<div class="error">${esc(s.error)}</div><button type="submit" class="primary">${reg?'Creează cont local':'Intră în cont'} ${next}</button></form><button class="secondary" onclick="s.mode='${reg?'login':'signup'}';s.error='';render()">${reg?'Ai deja cont? Autentifică-te':'Nu ai cont? Creează unul'}</button>${notice('🔒','Prototip: datele se salvează doar în browser. Nu folosi o parolă reală; autentificarea nu este securizată.')}<div class="push"></div></div>`}
// Browser preview intentionally never stores user passwords. It's a flow demo, not real authentication.
function authSubmit(e){e.preventDefault();let reg=s.mode==='signup';s.error='';if(reg&&s.name.trim().length<2)s.error='Introdu un nume de cel puțin 2 caractere.';else if(!/^\S+@\S+\.\S+$/.test(s.email))s.error='Introdu o adresă de email validă.';else if(s.password.length<8)s.error='Parola trebuie să aibă minimum 8 caractere.';else if(reg&&s.password!==s.confirm)s.error='Parolele nu coincid.';else if(reg&&!s.accepted)s.error='Confirmă limitările contului local.';else if(reg&&localStorage.getItem('bunplan-account'))s.error='Există deja un cont local în acest browser.';else if(!reg&&(!localStorage.getItem('bunplan-account')||JSON.parse(localStorage.getItem('bunplan-account')).email!==s.email))s.error='Nu există un cont demonstrativ cu acest email.';if(s.error){render();return}if(reg)localStorage.setItem('bunplan-account',JSON.stringify({name:s.name,email:s.email,plan:{budget:s.budget,adults:s.adults,children:s.children,diet:s.diet,meals:s.meals,time:s.time,stores:s.stores,city:s.city}}));else{let p=JSON.parse(localStorage.getItem('bunplan-account'));s.name=p.name;Object.assign(s,p.plan)}s.password='';s.confirm='';try{localStorage.setItem('bunplan-session','1')}catch(e){}window.location.href='main.html#bp='+encodeURIComponent(JSON.stringify({name:s.name,email:s.email,plan:{budget:s.budget,adults:s.adults,children:s.children,diet:s.diet,meals:s.meals,time:s.time,stores:s.stores,city:s.city}}));return}
function home(){return `<div class="in home"><div class="home-head">${brand()}<button class="back" onclick="s.page='welcome';render()">Ieși</button></div><h1>Salut, ${esc((s.name||'prietene').split(' ')[0])} 👋</h1><p class="sub">Hai să facem o săptămână gustoasă.</p><div class="bigcard"><div class="label">Bugetul tău săptămânal</div><div class="bigmoney">${s.budget} RON</div><small>${s.adults+s.children} persoane &nbsp;·&nbsp; ${7*s.meals} mese/7 zile</small><br/><button class="edit" onclick="s.step=0;s.page='wizard';render()">Editează preferințele ↗</button></div><h3 style="margin:0 0 5px;font-size:21px;letter-spacing:-.3px">Inspirație pentru meniul tău</h3><p class="sub" style="font-size:12px">Rețete demonstrative — încă fără optimizarea de preț.</p>${[['🥣','Ovăz cu banane','Mic dejun · 10 minute'],['🍗','Pui cu orez și legume','Prânz · 35 minute'],['🥘','Tocăniță de linte','Cină · 30 minute']].map(([i,t,d])=>`<div class="recipe"><span class="ico">${i}</span><div><strong>${t}</strong><small>${d}</small></div></div>`).join('')}${notice('ⓘ','Motorul automat de rețete și integrarea prețurilor urmează în etapa a doua.')}</div>`}
function render(){document.getElementById('app').innerHTML=s.page==='welcome'?welcome():s.page==='wizard'?wizard():s.page==='auth'?auth():home();window.scrollTo(0,0)}
render();
</script>
</body></html>
