<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>BunPlan</title><style>
:root{font-family:system-ui,sans-serif;color:#12382b;background:#f4f7ed}
*{box-sizing:border-box}body{margin:0;padding:32px 22px}section{max-width:450px;margin:auto}
h1{font-size:34px;margin:15px 0}h2{font-size:26px;line-height:1.15;margin:16px 0}
p{color:#607268;line-height:1.5}input{display:block;width:100%;border:1px solid #cfdccc;background:white;border-radius:15px;margin:11px 0;padding:17px;font-size:16px}
button{font-size:16px;font-weight:750;border:0;border-radius:16px;padding:17px;cursor:pointer;width:100%;margin:8px 0;color:white;background:#16543c}
button.other{color:#16543c;background:#e0f2ba}button:disabled{opacity:.55}
.hero{background:#164b36;color:white;border-radius:28px;padding:25px;margin:23px 0}
.hero p{color:#e0efdb}#message{background:#e0edcf;padding:14px;border-radius:12px;display:none;line-height:1.5}
.brand{font-size:24px;font-weight:900}small{display:block;text-align:center;color:#798b7e;margin:20px 0}
</style></head><body><section><div class="brand">🥬 BunPlan</div><div class="hero"><h2>Planifică mesele, nu cheltuielile neprevăzute.</h2><p>Rețete, buget săptămânal și lista de cumpărături pentru Lidl sau Kaufland.</p></div>
<div id="login">
<h1>Contul tău BunPlan</h1><p id="subtitle">Conectează-te pentru a continua.</p>
<div id="displayHolder" style="display:none"><input autocomplete="name" id="display" placeholder="Numele tău"></div>
<input id="email" type="email" autocomplete="email" placeholder="Adresa de e-mail">
<input id="password" type="password" autocomplete="current-password" placeholder="Parola (minimum 8 caractere)">
<p id="message"></p><button id="action" onclick="submitAuth()">Conectează-te</button>
<button class="other" id="switch" onclick="toggle()">Nu ai cont? Înregistrează-te</button>
<small>Autentificare Supabase • datele sunt salvate securizat în cloud</small>
</div></section><script>
let signup=false,busy=false;
const $=id=>document.getElementById(id);
const bridge=window.BunPlanAuth;
if(bridge&&bridge.hasSession())window.location.replace('main.html');
function toggle(){signup=!signup;$('displayHolder').style.display=signup?'block':'none';$('action').textContent=signup?'Creează cont':'Conectează-te';$('switch').textContent=signup?'Ai deja cont? Conectează-te':'Nu ai cont? Înregistrează-te';$('subtitle').textContent=signup?'Creează contul și confirmă adresa de e-mail.':'Conectează-te pentru a continua.';show('');}
function show(msg){$('message').textContent=msg;$('message').style.display=msg?'block':'none';}
function submitAuth(){if(busy)return;if(!bridge){show('Autentificarea este disponibilă numai în aplicația Android.');return;} const e=$('email').value.trim(),p=$('password').value;if(!e.includes('@')||p.length<8){show('Introdu un e-mail valid și o parolă de minimum 8 caractere.');return;}busy=true;$('action').disabled=true;show('Conectare la server...');signup?bridge.signup(e,p,$('display').value):bridge.login(e,p);}
window.BunPlanAuthDone=function(action,r){busy=false;$('action').disabled=false;if(!r.ok){show(r.message||'Eroare de autentificare.');return;}if(r.signed_in){window.location.replace('main.html');return;}show(r.message||'Confirmă contul pe e-mail și conectează-te.');};
</script></body></html>
