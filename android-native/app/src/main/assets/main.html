'use strict';const STORES=['Lidl','Kaufland'];const products={oats:['Fulgi de ovăz',500,6.9],milk:['Lapte',1000,7.5],banana:['Banane',1000,7.9],egg:['Ouă',10,12.9],chicken:['Piept de pui',1000,32.9],rice:['Orez',1000,9.9],carrot:['Morcovi',1000,5.4],onion:['Ceapă',1000,4.9],lentil:['Linte',500,8.9],tomato:['Roșii',1000,11.9],bread:['Pâine integrală',500,7.9],cheese:['Brânză',400,18.9],yogurt:['Iaurt',500,7.9],pasta:['Paste',500,6.9],pepper:['Ardei',500,8.5],potato:['Cartofi',2000,11.9],beans:['Fasole',500,8.5],spinach:['Spanac',400,9.9],apple:['Mere',1000,7.5],chickpea:['Năut',500,8.8],cucumber:['Castraveți',500,6.9],oil:['Ulei',1000,10.9]};
const recipes=[{id:1,name:'Overnight oats cu banane',type:'Mic dejun',emoji:'🥣',mins:10,tag:'Fără gătit',category:'green',ingredients:{oats:100,milk:400,banana:200,yogurt:200},steps:['Amestecă ovăzul cu laptele și iaurtul.','Lasă la frigider peste noapte.','Adaugă bananele înainte de servire.']},{id:2,name:'Omletă cu spanac',type:'Mic dejun',emoji:'🍳',mins:15,tag:'Proteic',category:'pink',ingredients:{egg:4,spinach:140,bread:160},steps:['Bate ouăle.','Sotează spanacul într-o tigaie.','Adaugă ouăle și gătește la foc mic.']},{id:3,name:'Iaurt cu măr și ovăz',type:'Mic dejun',emoji:'🍏',mins:5,tag:'Rapid',category:'lilac',ingredients:{yogurt:300,apple:240,oats:80},steps:['Taie mărul în cuburi.','Combină-l cu iaurtul și ovăzul.']},{id:4,name:'Toast cu brânză și roșii',type:'Mic dejun',emoji:'🥪',mins:10,tag:'Simplu',category:'pink',ingredients:{bread:160,cheese:100,tomato:150},steps:['Rumenește feliile de pâine.','Adaugă brânza și roșiile feliate.']},{id:5,name:'Pui cu orez și legume',type:'Prânz',emoji:'🍗',mins:35,tag:'Preferat',category:'pink',ingredients:{chicken:350,rice:180,carrot:180,pepper:150,onion:70},steps:['Fierbe orezul conform ambalajului.','Gătește puiul la tigaie.','Adaugă legumele și combină preparatele.']},{id:6,name:'Paste cu sos de roșii',type:'Prânz',emoji:'🍝',mins:25,tag:'Economic',category:'green',ingredients:{pasta:200,tomato:300,onion:80,cheese:60},steps:['Fierbe pastele.','Călește ceapa și roșiile.','Amestecă sosul cu pastele și brânza.']},{id:7,name:'Salată cu năut',type:'Prânz',emoji:'🥗',mins:15,tag:'Vegetarian',category:'lilac',ingredients:{chickpea:200,tomato:180,cucumber:180,pepper:100,oil:20},steps:['Fierbe năutul dacă este crud.','Taie legumele și amestecă ingredientele.']},{id:8,name:'Cartofi copți cu iaurt',type:'Cină',emoji:'🥔',mins:40,tag:'Confort',category:'green',ingredients:{potato:600,yogurt:200,cheese:80,cucumber:150},steps:['Coace cartofii până se înmoaie.','Servește cu iaurt, brânză și castraveți.']},{id:9,name:'Tocăniță de linte',type:'Cină',emoji:'🥘',mins:30,tag:'Bogată în fibre',category:'pink',ingredients:{lentil:220,carrot:180,onion:100,tomato:250},steps:['Călește ceapa și morcovii.','Adaugă lintea, apa și roșiile.','Fierbe până se înmoaie lintea.']},{id:10,name:'Salată cu ou și legume',type:'Cină',emoji:'🥬',mins:15,tag:'Ușor',category:'lilac',ingredients:{egg:4,tomato:200,cucumber:160,bread:130},steps:['Fierbe ouăle tari.','Taie legumele și servește cu pâine.']},{id:11,name:'Fasole cu legume',type:'Cină',emoji:'🫘',mins:35,tag:'Economic',category:'green',ingredients:{beans:240,onion:90,tomato:200,carrot:150},steps:['Fierbe fasolea înmuiată sau folosește una gătită.','Gătește legumele, apoi combină.']}];
const storeF={Lidl:0.94,Kaufland:1.03,Carrefour:1.10,'Mega Image':1.15};const storeColors={Lidl:'lidl',Kaufland:'kaufland',Carrefour:'carrefour','Mega Image':'mega'};
let acc={};try{acc=JSON.parse(localStorage.getItem('bunplan-account')||'{}')}catch{};let pl=acc.plan||{};
const state={tab:'home',name:acc.name||'Alex',budget:pl.budget||400,adults:pl.adults||2,children:pl.children||0,stores:(pl.stores&&pl.stores.length)?pl.stores:STORES.slice(),diet:pl.diet||'Echilibrat',meals:pl.meals||3,time:pl.time||30,city:pl.city||'București',filter:'Toate',day:0,store:'Lidl',unlocks:{},checked:{},modal:null,detail:null,search:'',favorites:[1,5],showOnlyFav:false};
try{Object.assign(state,JSON.parse(localStorage.getItem('bunplan-demo-state')||'{}'))}catch{};state.stores=STORES.filter(n=>state.stores.includes(n));if(!state.stores.length)state.stores=STORES.slice();
if(!STORES.includes(state.store))state.store=state.stores[0];
state.modal=null;state.tab='home';const storage=()=>{const v={...state,modal:null,detail:null};try{localStorage.setItem('bunplan-demo-state',JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ron=n=>new Intl.NumberFormat('ro-RO',{maximumFractionDigits:2,minimumFractionDigits:2}).format(n);const logo=()=>`<div class="logo"><div class="mark">✳</div>bunplan<span style="font-size:10px;color:#729482;font-weight:700;letter-spacing:0">BETA</span></div>`;const cap=()=>`<div class="smallcaps">DEMONSTRAȚIE · PREȚURI FICTIVE</div>`;
function plan(){let types=state.meals===2?['Prânz','Cină']:['Mic dejun','Prânz','Cină'], p=[];for(let d=0;d<7;d++){p[d]=types.map((t,i)=>{let arr=recipes.filter(r=>r.type===t);if(state.diet==='Vegetarian')arr=arr.filter(r=>!('chicken' in r.ingredients));const faster=arr.filter(r=>r.mins<=state.time);if(faster.length)arr=faster;return arr[(d+(i===1?1:i===2?2:0))%arr.length]})}return p}
function ingredients(){const sum={};for(const day of plan())for(const r of day)for(const [id,amount] of Object.entries(r.ingredients))sum[id]=(sum[id]||0)+amount*(state.adults+state.children*.65)/2;return sum}
function cart(store){return Object.entries(ingredients()).map(([id,q])=>{const p=products[id],qty=Math.ceil(q/p[1]),price=Math.round(qty*p[2]*storeF[store]*100)/100;return {id,name:p[0],needed:q,pack:p[1],packs:qty,price}}).sort((a,b)=>a.name.localeCompare(b.name,'ro'))}
function total(store){return cart(store).reduce((n,p)=>n+p.price,0)}function cheapest(){return state.stores.slice().sort((a,b)=>total(a)-total(b))[0]||'Lidl'}function rprice(r){return Object.entries(r.ingredients).reduce((a,[k,v])=>a+v/products[k][1]*products[k][2]*storeF[cheapest()],0)*(state.adults+state.children*.65)/2}
const nav=[['home','⌂','Acasă'],['plan','▦','Planul'],['stores','▤','Magazine'],['list','☑','Lista'],['profile','☺','Profil']];const commonTop=()=>`<header class="top">${logo()}<button class="avatar" onclick="go('profile')">👩‍🍳</button></header>`;
function heading(x,y){return `<h1 class="title">${x}</h1><p class="sub">${y}</p>`}function recipeCard(r){return `<article class="recipe" onclick="detail(${r.id})"><div class="foodart ${r.category}">${r.emoji}<button aria-label="Favorite" class="heart" onclick="event.stopPropagation();fav(${r.id})">${state.favorites.includes(r.id)?'♥':'♡'}</button></div><div class="recipebody"><strong>${esc(r.name)}</strong><small>⏱ ${r.mins} min · ${esc(r.type)}</small><div class="row"><span class="price">~${ron(rprice(r))} lei</span><span class="tag">${esc(r.tag)}</span></div></div></article>`}
function offers(){return REAL_PRODUCTS.filter(p=>state.stores.includes(p.store)&&p.oldPrice&&(!p.validTo||p.validTo>=new Date().toISOString().slice(0,10))).slice(0,4).map(p=>`<div class="p-itemoffer"><div>${p.image?`<img src="${esc(p.image)}" loading="lazy" onerror="this.style.display='none'"/>`:`<span style="font-size:30px">${p.emoji}</span>`}</div><div class="grow"><strong style="font-size:12px">${esc(p.name)}</strong><div class="p-muted">${esc(p.store)} · ${esc(p.amount)} · ${esc(p.kind)}</div><small>Valabil până la ${p.validTo}</small></div><div><div class="price">${ron(p.price)} lei</div><small><s>${ron(p.oldPrice)} lei</s></small></div></div>`).join('')+`<button class="link" onclick="go('catalog')">Vezi produse cu prețuri verificate →</button>`}
function home(){let t=cheapest(),sum=total(t);return `${commonTop()}${heading(`Salut, ${esc(state.name.split(' ')[0])}! 👋`,'Săptămâna bună începe cu un plan simplu.')}<section class="hero"><div class="orb"></div><div class="orb2"></div><div class="smallcaps">BUGET SĂPTĂMÂNAL</div><div class="heroMoney">${state.budget} <small>lei</small></div><div class="row"><span style="color:#d8e8df;font-size:12px">Coș estimat la ${t}</span><span style="font-weight:800">~${ron(sum)} lei</span></div><div class="progress"><i style="width:${Math.min(100,sum/state.budget*100)}%"></i></div><div class="herofoot"><span>${sum<=state.budget?'✓ În bugetul ales':'⚠ Peste buget cu '+ron(sum-state.budget)+' lei'}</span><button class="btn lime sm" onclick="go('plan')">Vezi planul ↗</button></div></section><div class="row section"><h2 class="h2">Ce gătim bun?</h2><button class="link" onclick="go('recipes')">Toate rețetele →</button></div><div class="tabs">${['Toate','Rapid','Economic','Vegetarian'].map(f=>`<button class="chip ${state.filter===f?'selected':''}" onclick="filter('${f}')">${f}</button>`).join('')}</div><div class="recipes">${recipes.filter(r=>state.filter==='Toate'||(state.filter==='Rapid'?r.mins<=15:state.filter==='Economic'?r.tag==='Economic':r.tag==='Vegetarian'||!('chicken' in r.ingredients))).slice(0,4).map(recipeCard).join('')}</div><div class="row section"><h2 class="h2">Reduceri în vizor</h2><button class="link" onclick="go('offers')">Vezi toate →</button></div><div class="muted" style="margin-bottom:10px">Exemple de prezentare. Nu sunt oferte reale.</div>${offers()}<div class="dealbar"><div style="font-size:30px">🛒</div><div class="grow"><b>Unde ieși cel mai bine?</b><p>Compară coșul săptămânal în 2 magazine.</p></div><button class="btn sm" onclick="go('stores')">Compară</button></div>${cap()}`}
function planScreen(){let all=plan(),sum=total(cheapest());return `${commonTop()}${heading('Meniul tău, gata! 🥗',`${state.meals*7} mese pentru 7 zile, potrivite familiei tale.`)}<div class="hero" style="min-height:150px"><div class="orb"></div><div class="smallcaps">PLAN DE 7 ZILE</div><div class="heroMoney" style="font-size:32px">${state.adults+state.children} persoane</div><div class="row" style="font-size:12px;color:#dbeadf"><span>${state.diet}</span><b>~${ron(sum)} lei / coș</b></div><div class="herofoot"><span>${sum<=state.budget?'Buget respectat (demo)':'Buget depășit (demo)'}</span><button class="btn lime sm" onclick="go('stores')">Vezi magazinele ↗</button></div></div><div class="calbox">${['L','M','M','J','V','S','D'].map((n,i)=>`<button class="daychip ${state.day===i?'active':''}" onclick="chooseDay(${i})">${n}<b>${i+1}</b></button>`).join('')}</div><div class="row"><h2 class="h2">Ziua ${state.day+1}</h2><span class="muted">${state.meals} mese · gramaje per familie</span></div><div class="day">${all[state.day].map((r,i)=>`<div class="meal" onclick="detail(${r.id})" style="cursor:pointer"><span>${r.emoji}</span><div class="grow"><small>${r.type}</small><b>${r.name}</b><small>${r.mins} min · ~${ron(rprice(r))} lei</small></div><span style="color:var(--green)">›</span></div>`).join('')}</div><button class="btn block" onclick="go('stores')">Compară costul cumpărăturilor →</button><div class="notice">ℹ️ Costul coșului include ambalaje întregi și poate diferi de suma porțiilor. Planul folosește date demonstrative; nu garantează respectarea bugetului.</div>`}
function storesScreen(){const v=state.stores.map(s=>({s,t:total(s)})).sort((a,b)=>a.t-b.t);return `${commonTop()}${heading('Unde cumperi mai bine?','Compară costul aceluiași coș pentru 7 zile.')}<div class="dealbar"><span style="font-size:27px">📍</span><div class="grow"><b>${esc(state.city)}</b><p>Locație selectată · magazine demo</p></div><button class="link" onclick="go('profile')">Modifică</button></div><div class="notice">⚠️ Prețuri illustrative, nu verificate pe magazine sau locații. Nu reprezintă disponibilitate reală.</div><div class="row section"><h2 class="h2">Comparație coș</h2><span class="tag">${Object.keys(ingredients()).length} ingrediente</span></div>${v.map((x,i)=>`<div class="store"><div class="storeicon ${storeColors[x.s]}">${x.s==='Mega Image'?'MEGA':x.s}</div><div class="grow"><strong>${x.s}</strong><small>${i===0?'✦ Cel mai ieftin în simulare':'Preț demonstrativ'} · ${cart(x.s).length} produse</small><button class="link" style="padding:0" onclick="openList('${x.s}')">${state.unlocks[x.s]?'Vezi lista ✓':'Deblochează lista ↗'}</button></div><div style="text-align:right"><div class="bigprice">${ron(x.t)} <small>lei</small></div><div class="val">${x.t<=state.budget?'În buget':'Peste buget'}</div></div></div>`).join('')}<div class="row section"><h2 class="h2">Prețuri pe ingredient</h2><span class="tag">Pachet · demo</span></div>${['milk','egg','chicken','rice','tomato'].map(id=>{const ing=products[id];const options=state.stores.map(s=>({s,v:Math.round(ing[2]*storeF[s]*100)/100})).sort((a,b)=>a.v-b.v);return `<div class="offer"><div class="offem">${({milk:'🥛',egg:'🥚',chicken:'🍗',rice:'🍚',tomato:'🍅'})[id]}</div><div class="grow"><strong>${ing[0]}</strong><small>Exemplu de preț minim: ${options[0].s}</small></div><div style="text-align:right"><b class="price">${ron(options[0].v)} lei</b><small>${ing[1]<100?ing[1]+' buc.':ing[1]+' g/ml'}</small></div></div>`}).join('')}<div class="notice">Aceste rezultate nu confirmă că produsele sunt disponibile fizic în magazine. Prețurile sunt generate fictiv.</div><button class="btn block" onclick="go('list')">Listele mele →</button>`}
function listScreen(){let s=state.store;if(!state.stores.includes(s))s=state.stores[0]||'Lidl';let unlocked=!!state.unlocks[s];return `${commonTop()}${heading('Lista de cumpărături','Toate ingredientele, grupate inteligent.')}<div class="capslabel">Alege supermarketul</div><div class="tabs">${state.stores.map(n=>`<button class="chip ${n===s?'selected':''}" onclick="selectStore('${n}')">${n}</button>`).join('')}</div>${!unlocked?`<div class="storepanel" style="text-align:center;padding:27px 17px"><div class="bigemoji" style="margin:auto">🔒</div><h2 class="h2" style="margin:16px 0 7px">Lista ${s} e blocată</h2><p class="sub">Vezi o reclamă recompensată pentru a debloca lista de cumpărături a acestui magazin.</p><b style="font-size:27px">~${ron(total(s))} lei</b><p class="muted">${cart(s).length} ingrediente · exemplu</p><button class="btn block" onclick="unlock('${s}')">▶ Deblochează prin reclamă</button><p style="font-size:11px;color:var(--muted)">DEMO: se deschide o simulare, fără reclamă reală.</p></div>`:`<div class="hero" style="min-height:142px"><div class="smallcaps">LISTĂ DEBLOCATĂ · ${s.toUpperCase()}</div><div class="heroMoney" style="font-size:33px">~${ron(total(s))} <small>lei</small></div><div class="herofoot"><span>${cart(s).length} tipuri de ingrediente</span><span>✓ Acces demo</span></div></div><div class="row section"><h2 class="h2">De pus în coș</h2><button class="link" onclick="resetCheck('${s}')">Resetează bifările</button></div><div class="storepanel" style="padding:5px 16px">${cart(s).map(p=>`<div class="listrow" onclick="toggleCheck('${s}','${p.id}')" style="cursor:pointer"><span class="check ${state.checked[s+':'+p.id]?'on':''}">${state.checked[s+':'+p.id]?'✓':''}</span><div class="grow ${state.checked[s+':'+p.id]?'striked':''}"><div class="itemname">${p.name}</div><small>${p.packs} × ${p.pack>=100?`${p.pack} g/ml`:`${p.pack} buc.`} · necesar aproximativ ${Math.round(p.needed)} ${p.pack>=100?'g/ml':'buc.'}</small></div><div class="itemprice">${ron(p.price)} lei</div></div>`).join('')}</div><div class="notice">Prețurile sunt generate pentru demonstrație și nu reflectă produse, stocuri sau prețuri în magazinele reale.</div><button class="btn block out" onclick="shareList('${s}')">⧉ Copiază lista de cumpărături</button>`}`}
function offersScreen(){return `${commonTop()}<button class="back" onclick="go('home')">← Înapoi</button>${heading('Reduceri & inspirație 🎁','O pagină pregătită pentru promoțiile magazinelor.')}<div class="warn">Aceste prețuri provin din pagini publice ale magazinelor, verificate la 17.10.2026; nu sunt actualizate automat.</div>${offers()}<div class="notice">Ofertele expiră, se aplică în limita stocurilor și pot depinde de locație sau de cardul de fidelitate.</div>`}
function recipeScreen(){let q=state.search.toLowerCase().trim();let arr=recipes.filter(r=>(r.name+' '+r.type).toLowerCase().includes(q));if(state.showOnlyFav)arr=arr.filter(r=>state.favorites.includes(r.id));return `${commonTop()}${heading('Gătește ceva bun 🍽','Rețete simple, adaptate la bugetul tău.')}<input class="search" placeholder="🔎 Caută rețete sau ingrediente..." value="${esc(state.search)}" oninput="state.search=this.value;refreshRecipes()" id="recipeSearch"/><div class="tabs"><button class="chip ${!state.showOnlyFav?'selected':''}" onclick="favOnly(false)">Toate</button><button class="chip ${state.showOnlyFav?'selected':''}" onclick="favOnly(true)">♥ Salvate (${state.favorites.length})</button></div><div id="recipeResults" class="recipes">${arr.map(recipeCard).join('')}</div>`}
function profileScreen(){return `${commonTop()}${heading('Profilul meu ⚙️','Configurează-ți planul în câteva secunde.')}<div class="storepanel"><div class="row"><div><div class="smallcaps">Cont local demonstrativ</div><h2 class="h2" style="margin-top:7px">${esc(state.name)}</h2></div><div class="avatar" style="width:58px;height:58px;font-size:30px">👩‍🍳</div></div></div><div class="storepanel"><div class="capslabel">Buget săptămânal</div><div class="heroMoney" style="color:var(--forest);font-size:31px">${state.budget} <small>lei</small></div><input type="range" min="100" max="1500" step="25" value="${state.budget}" style="width:100%;accent-color:var(--green)" oninput="setBudget(this.value)"/><div class="capslabel" style="margin-top:20px">Adulți</div><div class="pillbar">${[1,2,3,4].map(n=>`<button class="chip ${state.adults===n?'selected':''}" onclick="setAdults(${n})">${n}</button>`).join('')}</div><div class="capslabel" style="margin-top:20px">Copii</div><div class="pillbar">${[0,1,2,3].map(n=>`<button class="chip ${state.children===n?'selected':''}" onclick="setChildren(${n})">${n}</button>`).join('')}</div><div class="capslabel" style="margin-top:20px">Stil alimentar</div><div class="pillbar">${['Echilibrat','Economic','Vegetarian','Bogat în proteine'].map(n=>`<button class="chip ${state.diet===n?'selected':''}" onclick="setDiet('${n}')">${n}</button>`).join('')}</div></div><div class="storepanel"><div class="capslabel">Supermarketuri alese</div><div class="pillbar">${STORES.map(n=>`<button class="chip ${state.stores.includes(n)?'selected':''}" onclick="toggleShop('${n}')">${n}</button>`).join('')}</div><div class="capslabel" style="margin-top:17px">Oraș</div><input class="field" value="${esc(state.city)}" aria-label="Oraș" onchange="state.city=this.value;storage()" /></div><div class="notice">Profilul, lista bifată și deblocările demonstrative sunt păstrate în browser. Nu există în acest demo o autentificare cloud și nici reclame monetizate.</div><button class="btn out block" onclick="resetDemo()">Resetează demonstrația</button>`}
function detailScreen(){let r=recipes.find(r=>r.id===state.detail);if(!r)return home();return `${commonTop()}<button class="back" onclick="closeDetail()">← Înapoi</button><div class="detailart">${r.emoji}</div><div class="headlabel"><span class="tag">${r.type}</span><span class="tag">${r.tag}</span></div><h1 class="title">${r.name}</h1><p class="sub">⏱ ${r.mins} minute · ${state.adults+state.children} persoane · ~${ron(rprice(r))} lei / preparat</p><div class="row section"><h2 class="h2">Ingrediente</h2><button class="link" onclick="fav(${r.id})">${state.favorites.includes(r.id)?'♥ Salvat':'♡ Salvează'}</button></div><div class="storepanel" style="padding:6px 17px">${Object.entries(r.ingredients).map(([k,v])=>`<div class="listrow"><div class="grow"><div class="itemname">${products[k][0]}</div><small>~${Math.round(v*(state.adults+state.children*.65)/2)} ${products[k][1]<100?'buc.':'g/ml'}</small></div><div class="pricebreak">~${ron(v/products[k][1]*products[k][2]*storeF[cheapest()]*(state.adults+state.children*.65)/2)} lei</div></div>`).join('')}</div><h2 class="h2 section">Cum prepari</h2><ol class="steps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol><button class="btn block" onclick="go('plan')">Vezi meniul pentru 7 zile</button><div class="notice">Cantitățile și costurile sunt aproximative; prețuri demo.</div>`}
function modal(){if(!state.modal)return '';let s=state.modal;return `<div class="modalback" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="row"><div class="bigemoji">🎬</div><button class="back" onclick="closeModal()">✕</button></div><h2>Deblochează lista ${s}</h2><p class="sub">În aplicația publicată, aici se va încărca o reclamă recompensată AdMob, afișată doar după ce alegi să o vezi.</p><div class="notice"><b>MOD DEMO</b> — Nu este afișată nicio reclamă și nu se obține venit. Acest buton simulează exclusiv rezultatul deblocării.</div><div class="stats"><div class="stat"><b>${cart(s).length}</b><small>ingrediente</small></div><div class="stat"><b>${ron(total(s))}</b><small>lei · cost estimat</small></div></div><button class="btn block" onclick="confirmDemo()">Deblochează lista (simulare)</button><button class="link" style="width:100%" onclick="closeModal()">Nu acum</button></div></div>`}
function go(tab){state.tab=tab;state.detail=null;state.modal=null;storage();draw()}function detail(id){state.detail=id;state.prevTab=state.tab;state.tab='detail';storage();draw()}function closeDetail(){go(state.prevTab||'home')}function fav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(n=>n!==id):[...state.favorites,id];storage();draw()}function filter(f){state.filter=f;storage();draw()}function chooseDay(d){state.day=d;storage();draw()}function openList(s){state.store=s;go('list')}function selectStore(s){state.store=s;storage();draw()}function unlock(s){state.modal=s;draw()}function closeModal(){state.modal=null;draw()}function confirmDemo(){state.unlocks[state.modal]=true;state.store=state.modal;state.modal=null;state.tab='list';storage();draw()}function toggleCheck(s,k){state.checked[s+':'+k]=!state.checked[s+':'+k];storage();draw()}function resetCheck(s){Object.keys(state.checked).filter(k=>k.startsWith(s+':')).forEach(k=>delete state.checked[k]);storage();draw()}function shareList(s){let l=`BunPlan · Lista ${s}\n${cart(s).map(p=>'- '+p.name+' · '+p.packs+' pachete').join('\n')}\nPrețuri demonstrative`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(l).then(()=>alert('Lista a fost copiată.')).catch(()=>window.prompt('Copiază lista:',l));else window.prompt('Copiază lista:',l)}function favOnly(v){state.showOnlyFav=v;storage();draw()}function refreshRecipes(){let q=state.search.toLowerCase().trim();let arr=recipes.filter(r=>r.name.toLowerCase().includes(q)||r.type.toLowerCase().includes(q));if(state.showOnlyFav)arr=arr.filter(r=>state.favorites.includes(r.id));document.getElementById('recipeResults').innerHTML=arr.map(recipeCard).join('')||'<div class="empty">Nicio rețetă găsită.</div>';storage()}function setBudget(n){state.budget=+n;storage();draw()}function setAdults(n){state.adults=n;storage();draw()}function setChildren(n){state.children=n;storage();draw()}function setDiet(n){state.diet=n;storage();draw()}function toggleShop(n){if(state.stores.includes(n)&&state.stores.length===1)return;state.stores=state.stores.includes(n)?state.stores.filter(s=>s!==n):[...state.stores,n];if(!state.stores.includes(state.store))state.store=state.stores[0];storage();draw()}function resetDemo(){if(confirm('Resetezi profilul și listele demo?')){try{localStorage.removeItem('bunplan-demo-state')}catch(e){};location.reload()}}
function draw(){let content=state.tab==='catalog'?catalogScreen():state.tab==='home'?home():state.tab==='plan'?planScreen():state.tab==='stores'?storesScreen():state.tab==='list'?listScreen():state.tab==='profile'?profileScreen():state.tab==='offers'?offersScreen():state.tab==='recipes'?recipeScreen():detailScreen();let bottom=nav.map(([id,ic,l])=>`<button class="nav ${state.tab===id?'active':''}" onclick="go('${id}')"><span class="ni">${ic}</span>${l}</button>`).join('');document.getElementById('app').innerHTML=`<main class="scroll">${content}</main><nav class="bottom">${bottom}</nav>${modal()}`;window.scrollTo(0,0)}

function pImage(p){return p.image?`<img src="${esc(p.image)}" loading="lazy" referrerpolicy="no-referrer" alt="${esc(p.name)}" onerror="this.remove();this.parentElement.innerHTML='<span class=p-icon>${p.emoji}</span>'"/>`:`<span class="p-icon">${p.emoji}</span>`}
function pLabel(p){let exp=p.validTo&&p.validTo<new Date().toISOString().slice(0,10);return exp?'Ofertă expirată':p.kind==='Lidl Plus'?'Doar cu Lidl Plus':p.kind==='promoție'?'Promoție':p.kind==='preț online'?'Online · orientativ':'Preț în catalog'}
function pCard(p){let count=state.catalogSelected[p.id]||0;return `<article class="p-card"><div class="p-ph">${pImage(p)}</div><div class="p-brand">${esc(p.brand)} · ${esc(p.store)}</div><div class="p-name">${esc(p.name)}</div><span class="p-pill ${p.oldPrice?'sale':''}">${esc(pLabel(p))}</span><div class="p-price">${ron(p.price)} <span style="font-size:11px">lei</span></div><div class="p-unit">${esc(p.amount)}${p.oldPrice?` · <s>${ron(p.oldPrice)} lei</s>`:''}</div><div class="p-foot">${p.validTo?'Valabil '+p.validFrom.slice(8,10)+'.'+p.validFrom.slice(5,7)+'–'+p.validTo.slice(8,10)+'.'+p.validTo.slice(5,7):'Preț site, nu preț garantat local'} · verificat 17.10</div><div class="p-actions"><button onclick="window.open('${p.source}','_blank','noopener')">Sursa ↗</button><button class="add" onclick="addVerified('${p.id}')">${count?'✓ '+count+' buc.':'＋ Listă'}</button></div></article>`}
function catalogScreen(){let a=REAL_PRODUCTS.filter(p=>(state.catalogStore==='Toate'||p.store===state.catalogStore)&&state.stores.includes(p.store)&&[p.name,p.brand,p.amount,p.category,p.store].join(' ').toLowerCase().includes(state.catalogQuery.toLowerCase()));let all=REAL_PRODUCTS.filter(p=>state.stores.includes(p.store));return `${commonTop()}<button class="back" onclick="go('home')">← Acasă</button>${heading('Produse reale 🛒','Produse publicate de comercianți; costurile estimate ale rețetelor sunt separat marcate.')}<div class="real-banner"><strong>PREȚURI VERIFICATE 17 OCTOMBRIE 2026</strong><br/>Date salvate în aplicație, nu sincronizate live. Prețurile și stocurile diferă în funcție de locație. Lidl și Kaufland au și promoții limitate.</div><input class="p-headsearch" id="catalogQuery" aria-label="Caută produse" placeholder="🔎 Caută lapte, ouă, linte..." value="${esc(state.catalogQuery)}" oninput="state.catalogQuery=this.value;refreshCatalog()"/><div class="p-stores" style="margin-top:12px">${['Toate',...state.stores].map(s=>`<button class="chip ${state.catalogStore===s?'selected':''}" onclick="filterVerified('${s}')">${s}</button>`).join('')}</div><div class="row"><span class="p-muted" id="productCount">${a.length} din ${all.length} produse</span><button class="link" onclick="go('list')">Lista mea (${Object.values(state.catalogSelected).reduce((a,b)=>a+b,0)}) →</button></div><div class="cataloggrid" id="productGrid">${a.map(pCard).join('')||'<div class="p-muted">Niciun produs găsit.</div>'}</div><div class="real-banner">Fotografiile aparțin comercianților / deținătorilor drepturilor și sunt afișate în prototip doar pentru evaluare. Pentru publicarea comercială trebuie aprobată utilizarea lor. <strong>Nu există acces la stocul unui magazin local.</strong></div>`}
function refreshCatalog(){let a=REAL_PRODUCTS.filter(p=>(state.catalogStore==='Toate'||p.store===state.catalogStore)&&state.stores.includes(p.store)&&[p.name,p.brand,p.amount,p.category,p.store].join(' ').toLowerCase().includes(state.catalogQuery.toLowerCase()));document.getElementById('productGrid').innerHTML=a.map(pCard).join('')||'<div class="p-muted">Niciun produs găsit.</div>';document.getElementById('productCount').textContent=a.length+' produse'}
function filterVerified(s){state.catalogStore=s;state.catalogQuery='';draw()}
function addVerified(id){state.catalogSelected[id]=(state.catalogSelected[id]||0)+1;try{localStorage.setItem('bunplan-real-selection',JSON.stringify(state.catalogSelected))}catch(e){}draw()}
function minusVerified(id){let n=state.catalogSelected[id]||0;if(n<=1)delete state.catalogSelected[id];else state.catalogSelected[id]=n-1;try{localStorage.setItem('bunplan-real-selection',JSON.stringify(state.catalogSelected))}catch(e){}draw()}
function verifiedSelection(s){let prods=REAL_PRODUCTS.filter(p=>p.store===s&&(state.catalogSelected[p.id]||0)>0);if(!prods.length)return '<p class="p-muted">Nu ai adăugat produse reale de la acest magazin. Mergi în catalog.</p>';let total=prods.reduce((sum,p)=>sum+p.price*state.catalogSelected[p.id],0);return `<div class="p-total">Produse verificate selectate: ${ron(total)} lei</div>${prods.map(p=>`<div class="p-linerow"><div>${pImage(p)}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="p-muted">${esc(p.amount)} · ${state.catalogSelected[p.id]} buc.</div><a class="p-source" style="font-size:10px" href="${p.source}" target="_blank" rel="noopener">Vezi sursa</a></div><strong>${ron(p.price*state.catalogSelected[p.id])} lei</strong><button class="chip" onclick="minusVerified('${p.id}')">−</button></div>`).join('')}`}
const demoHome=home; home=function(){return demoHome()+`<section class="cataloglink"><div class="smallcaps" style="color:#d9f47b">NOU · PREȚURI REALE</div><h3>Produse reale din 2 magazine</h3><p style="font-size:12px;color:#d5e6d7">${REAL_PRODUCTS.length} produse, poze și surse verificabile · prețuri observate la 17 oct.</p><button class="btn lime sm" onclick="go('catalog')">Descoperă produsele ↗</button></section>`};
const demoStores=storesScreen; storesScreen=function(){return demoStores()+`<section class="cataloglink"><h3>Compară produse cu preț verificat</h3><p style="font-size:12px;color:#d5e6d7">Prețurile afișate mai sus pentru coș sunt încă simulări. Catalogul real este separat.</p><button class="btn lime sm" onclick="go('catalog')">Vezi catalogul real ↗</button></section>`};
const demoList=listScreen; listScreen=function(){return demoList()+`<div class="section"><h2 class="h2">Produse reale salvate · ${esc(state.store)}</h2><p class="p-muted">Prețuri publicate la 17.10.2026, fără garanția stocului.</p>${state.unlocks[state.store]?verifiedSelection(state.store):'<div class="real-banner">Lista de produse selectate poate fi vizualizată după deblocarea demonstrativă. Nu este încă integrată o reclamă reală.</div>'}<button class="btn sm out" onclick="go('catalog')">＋ Adaugă produse din catalog</button></div>`};
draw();

window.bpProfilePrivacy=function(){location.href='https://github.com/birisiu/BunPlan/blob/main/PRIVACY.md';};
window.bpProfileLogout=function(){
 if(!confirm('Vrei să te deconectezi? Datele nesincronizate se pot pierde.'))return;
 if(nativeAuth)nativeAuth.logout();
 // Keep only the fact that the first-run questionnaire was completed.
 // Never retain another account's private profile or shopping data on logout.
 const firstRunCompleted=(()=>{try{return !!JSON.parse(localStorage.getItem('bunplan_onboard_v2')||'null')?.completed;}catch(_){return false;}})();
 localStorage.clear();
 if(firstRunCompleted)localStorage.setItem('bunplan_onboard_v2',JSON.stringify({completed:true}));
 location.replace('index.html');
};
window.bpProfileDelete=function(){
 const typed=prompt('Pentru a șterge definitiv contul și datele, introdu ȘTERGE');
 if(typed==='ȘTERGE'&&nativeCloud)nativeCloud.deleteAccount(typed);
};
const prevHandler=window.BunPlanCloudDone;
window.BunPlanCloudDone=function(action,result){
 if(action==='profile-save'){message(result&&result.ok?'Preferințele au fost salvate în cloud.':'Nu s-a putut salva profilul: '+(result?.message||''));return;}
 if(action==='profile-load'){
   if(!result||!result.ok){message('Nu s-a putut încărca profilul.');return;}
   const data=result.data||{};
   if(data.onboarding_completed){applyPrefs(data);}
   else if(onboard&&onboard.completed){applyPrefs(onboard);window.bpProfileSave();}
   return;
 }
 if(action==='delete'&&result&&result.ok){localStorage.clear();}
 if(typeof prevHandler==='function')prevHandler(action,result);
};
if(nativeCloud)nativeCloud.loadProfile();
if(state.tab==='home'||state.tab==='stores')draw();
})();
</script></body></html>
