plugins { id 'com.android.application' }
android {
    namespace 'ro.bunplan.app'
    compileSdk 35
    defaultConfig { applicationId 'ro.bunplan.app'; minSdk 23; targetSdk 35; versionCode 36; versionName '3.6-test-admob' }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
