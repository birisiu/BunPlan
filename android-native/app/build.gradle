plugins { id 'com.android.application' }
android {
    namespace 'ro.bunplan.app'
    compileSdk 35
    defaultConfig { applicationId 'ro.bunplan.app'; minSdk 24; targetSdk 35; versionCode 40; versionName '4.0-supabase-auth' }
    buildTypes { debug { applicationIdSuffix '.cloudtest'; minifyEnabled false }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.google.android.gms:play-services-ads:25.5.0'
 implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
 implementation 'androidx.annotation:annotation:1.9.1'
}
